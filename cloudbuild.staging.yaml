# Cloud Build configuration for staging deployment
# Service: ks-ai-openwebui-staging
# Region: europe-west4
# Platform: Google Cloud Run

steps:
  # Pull previous image to seed the layer cache (best-effort — fails harmlessly on first build)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - 'docker pull ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${REPO_NAME}/${_SERVICE_NAME}:latest || exit 0'
    id: Pull

  # Build Docker image, reusing cached layers (e.g. pip install) from the previous image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '-t'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${REPO_NAME}/${_SERVICE_NAME}:latest'
      - '--cache-from'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${REPO_NAME}/${_SERVICE_NAME}:latest'
      - '-f'
      - 'Dockerfile'
      - '--build-arg'
      - 'DEPLOY_ENVIRONMENT=staging'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '.'
    id: Build
    waitFor: ['Pull']
    env:
      - 'DOCKER_BUILDKIT=1'

  # Push image with commit SHA tag to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
    id: Push

  # Deploy to Cloud Run staging service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update'
      - '${_SERVICE_NAME}'
      - '--platform=${_PLATFORM}'
      - '--image=${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=${COMMIT_SHA},gcb-build-id=${BUILD_ID},gcb-trigger-id=${_TRIGGER_ID}'
      - '--region=${_DEPLOY_REGION}'
      - '--quiet'
    id: Deploy

# Substitution variables
substitutions:
  _AR_HOSTNAME: 'europe-west4-docker.pkg.dev'
  _AR_PROJECT_ID: 'keeper-ai'
  _AR_REPOSITORY: 'cloud-run-source-deploy'
  _SERVICE_NAME: 'ks-ai-openwebui-staging'
  _DEPLOY_REGION: 'europe-west4'
  _PLATFORM: 'managed'
  _TRIGGER_ID: '637eae3c-74df-4ccd-83e1-da78769b375b'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  substitutionOption: ALLOW_LOOSE

# Timeout set to 1 hour
timeout: 3600s
